# TLS certificate for the AI models gateway's external-facing listener.
# Signed by the intermediate CA so clients can verify the chain.
#
# Consumed by istio-ingress/ai-models-gateway, which is defined in the
# ossm-3-demo repo (resources/rhoai/overlays/models/ai-models-gateway.yaml)
# and reads this secret across namespaces through a ReferenceGrant. Don't
# copy the secret into istio-ingress: cert-manager only renews this one.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mesh-gateway-cert
  namespace: istio-system
spec:
  secretName: mesh-gateway-tls
  duration: 2160h # 90 days
  renewBefore: 360h
  commonName: "mesh-gateway.apps.tallgeese.ultra.lab"
  dnsNames:
    - "iris-onnx.apps.tallgeese.ultra.lab"
    - "phi-4-mini.apps.tallgeese.ultra.lab"
    - "mesh-gateway.apps.tallgeese.ultra.lab"
    - "phi4-mesh.apps.tallgeese.ultra.lab"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: mesh-intermediate-ca-issuer
    kind: Issuer
