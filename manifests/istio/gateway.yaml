apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mesh-gateway
  namespace: istio-system
spec:
  # TODO: determine the right gatewayClassName
  # Options:
  #   - "istio" (upstream Istio default)
  #   - "openshift-default" (Ingress Operator managed — but this creates a separate Istio)
  #   - A custom GatewayClass pointing to our Istio
  gatewayClassName: istio
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: mesh-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
