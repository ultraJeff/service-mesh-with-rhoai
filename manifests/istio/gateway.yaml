# North-south gateway for external traffic into the mesh.
# Uses the ambient mesh's istio GatewayClass (from ossm-3-demo).
# HTTPRoutes in any namespace can attach to this gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mesh-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: mesh-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
