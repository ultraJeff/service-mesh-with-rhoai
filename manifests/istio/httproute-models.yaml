# HTTPRoutes that attach to the mesh gateway for model serving.
# Traffic enters the mesh at the gateway and reaches model pods via mTLS.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iris-onnx-route
  namespace: super-slim-demo
spec:
  parentRefs:
    - name: mesh-gateway
      namespace: istio-system
  hostnames:
    - "iris-onnx.apps.tallgeese.ultra.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: iris-onnx-predictor
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phi-4-mini-route
  namespace: super-slim-demo
spec:
  parentRefs:
    - name: mesh-gateway
      namespace: istio-system
  hostnames:
    - "phi-4-mini.apps.tallgeese.ultra.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: phi-4-mini-predictor
          port: 80
