# STRICT mTLS — all traffic to pods in this namespace must be mTLS.
# This is possible because north-south traffic now enters through the
# mesh gateway (which speaks mTLS to backends via ztunnel), eliminating
# the plain-HTTP path from the RHOAI gateway.
# Prometheus metrics ports are exempted so platform monitoring can scrape.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: super-slim-demo
spec:
  mtls:
    mode: STRICT
---
# Allow Prometheus to scrape metrics ports without mTLS
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: allow-metrics-scrape
  namespace: super-slim-demo
spec:
  selector:
    matchLabels:
      app: isvc.iris-onnx-predictor
  mtls:
    mode: STRICT
  portLevelMtls:
    8082:
      mode: PERMISSIVE
